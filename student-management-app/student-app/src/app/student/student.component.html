<main class="dasboard">
  <app-navbar></app-navbar>

  <div class="table">
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8"
      class="table-container"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="class">
        <th mat-header-cell *matHeaderCellDef>Class</th>
        <td mat-cell *matCellDef="let element">{{ element.class | grade }}</td>
      </ng-container>

      <ng-container matColumnDef="totalMarks">
        <th mat-header-cell *matHeaderCellDef>Total Marks</th>
        <td mat-cell *matCellDef="let element">{{ element.totalMarks }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          {{ element.totalMarks | status }}
        </td>
      </ng-container>
      <ng-container matColumnDef="actions" class="action">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action">
            <button class="edit"


              (click)="navigateToEdit(element.id)"
              type="button"
            >
              <img src="/assets/icons/edit.svg" width="16" height="16" />
           
            </button>
            <button class="delete"
              (click)="openDeleteDialog(element.id, element.username)"
              type="button"
            >
              <img src="/assets/icons/delete.svg" width="16" height="16" />
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</main>
